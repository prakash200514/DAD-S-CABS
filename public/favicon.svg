<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded Card -->
  <rect width="512" height="512" rx="110" fill="url(#gradBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Road Curve Perspective representing Tamil Nadu Highways -->
  <path d="M90 410 L210 270 L302 270 L422 410 Z" fill="url(#roadGrad)" opacity="0.9"/>
  <!-- Road Dashes -->
  <path d="M256 280 L256 310 M256 335 L256 375" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 14"/>

  <!-- Auto Rickshaw Silhouette and Cabin -->
  <!-- Main Yellow Cabin Hood -->
  <path d="M165 310 
           L185 205 
           C192 170, 220 150, 260 150 
           L330 150 
           C365 150, 390 175, 395 210 
           L405 310 
           C405 325, 395 335, 380 335 
           L180 335 
           C168 335, 160 324, 165 310 Z" 
        fill="url(#yellowGrad)" filter="url(#glow)"/>

  <!-- Black Canvas Canopy Top -->
  <path d="M195 200 
           C200 165, 230 150, 260 150 
           L330 150 
           C365 150, 390 170, 395 205 
           L390 230 
           C360 215, 310 210, 260 210 
           C225 210, 205 218, 190 230 Z" 
        fill="#111827"/>

  <!-- Windshield -->
  <path d="M205 225 
           L220 175 
           C235 168, 255 165, 275 165 
           L310 165 
           L315 225 Z" 
        fill="#E0F2FE" opacity="0.85"/>

  <!-- Passenger Window Cutout -->
  <rect x="325" y="180" width="55" height="50" rx="8" fill="#1E293B" opacity="0.9"/>

  <!-- Wheels -->
  <!-- Front Wheel (Auto single front wheel) -->
  <circle cx="190" cy="350" r="32" fill="#0F172A" stroke="#F59E0B" stroke-width="5"/>
  <circle cx="190" cy="350" r="14" fill="#94A3B8"/>

  <!-- Rear Wheel -->
  <circle cx="375" cy="350" r="34" fill="#0F172A" stroke="#F59E0B" stroke-width="5"/>
  <circle cx="375" cy="350" r="14" fill="#94A3B8"/>

  <!-- Headlight beam -->
  <path d="M165 275 L90 295 L90 255 Z" fill="#FEF08A" opacity="0.7"/>
  <circle cx="168" cy="275" r="8" fill="#FFFFFF"/>

  <!-- Tamil Nadu Compass Pin Star -->
  <g transform="translate(256, 100)">
    <circle cx="0" cy="0" r="24" fill="#F59E0B"/>
    <path d="M0 -18 L4 -5 L17 -5 L7 3 L11 16 L0 8 L-11 16 L-7 3 L-17 -5 L-4 -5 Z" fill="#0B0F14"/>
  </g>
</svg>
